# Handicraft API — Nginx behind Cloudflare
#
# Use this instead of nginx-api.conf when the domain is proxied by Cloudflare
# (orange cloud). It differs in three ways that all matter:
#
#   1. TLS uses a Cloudflare Origin CA certificate, not Let's Encrypt. The
#      certificate is issued in the Cloudflare dashboard, is valid for 15 years,
#      and needs no renewal — so certbot never enters the picture. The edge
#      certificate visitors see is Cloudflare's, also automatic.
#   2. The real client IP is read from CF-Connecting-IP. Behind Cloudflare every
#      request arrives from a Cloudflare address, so without this every user
#      looks like the same client and per-IP rate limiting cannot tell them
#      apart.
#   3. No HTTP-to-HTTPS redirect server block: Cloudflare talks to this origin
#      over HTTPS only ("Full (strict)"), so port 80 has nothing to serve.
#
# Setup, in order:
#
#   1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate.
#      Leave the hostnames as api.20080831.xyz, pick 15 years, create.
#
#   2. Save the two PEM blocks:
#        /etc/nginx/certs/api.20080831.xyz.pem   ← "Origin Certificate"
#        /etc/nginx/certs/api.20080831.xyz.key   ← "Private Key"
#        chmod 600 /etc/nginx/certs/api.20080831.xyz.key
#
#   3. Cloudflare dashboard → SSL/TLS → Overview → set encryption mode to
#      "Full (strict)". Do NOT use "Flexible": it sends traffic between
#      Cloudflare and this server in plaintext, which would expose every API key
#      on the wire.
#
#   4. Install this file and start Nginx (Alpine paths shown):
#        cp deploy/nginx-cloudflare.conf \
#           /etc/nginx/http.d/api.20080831.xyz.conf
#        nginx -t && rc-service nginx start && rc-update add nginx default
#
#   5. Leave port 3000 closed to the internet (BIND_ADDR=127.0.0.1 in .env).
#      With Cloudflare in front there is no reason for it to be reachable at all.

# ---------------------------------------------------------------------------
# Real client IP.
#
# Cloudflare's published ranges, from https://www.cloudflare.com/ips/ — they
# change rarely but not never. To refresh from the source:
#
#   { curl -s https://www.cloudflare.com/ips-v4; curl -s https://www.cloudflare.com/ips-v6; } \
#     | sed 's/^/set_real_ip_from /; s/$/;/' > /etc/nginx/http.d/00-cloudflare-realip.conf
#   echo 'real_ip_header CF-Connecting-IP;' >> /etc/nginx/http.d/00-cloudflare-realip.conf
#
# The list is inlined below so this file works on its own. If you use the
# refresh command, delete the set_real_ip_from lines here to avoid duplicates
# (harmless, but noisy).
#
# Only addresses in this list may set the client IP. That is the point: without
# it, anyone could spoof the header and evade per-IP rate limits.
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # `http2` on the listen line rather than a separate `http2 on;` directive:
    # the standalone directive needs Nginx 1.25.1+, and Alpine 3.22 ships
    # 1.26 while 3.20 and earlier ship 1.24, where it fails `nginx -t` outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.20080831.xyz;

    ssl_certificate     /etc/nginx/certs/api.20080831.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/api.20080831.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Audio transcription and file uploads go through the relay. Cloudflare's
    # own request body limit is 100 MB on free plans, so this is the binding
    # constraint. Images are blocked by the application.
    client_max_body_size 32m;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr is the real client only because of the real_ip lines
        # above; without them it would be a Cloudflare address for everyone.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- the part that matters for an LLM gateway ----
        #
        # Responses are streamed token by token. Nginx buffers upstream
        # responses by default, which holds the stream until the buffer fills or
        # the response ends: chat clients then sit on an empty screen and only
        # print the whole answer at once.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # A slow model can take minutes to answer. The default 60s read timeout
        # cuts long generations off mid-stream, and the client sees a truncated
        # answer rather than an error.
        #
        # Note Cloudflare enforces its own 100s limit on time-to-first-byte
        # regardless of these values: it is measured until the origin starts
        # responding, so a model that thinks for over 100 seconds before the
        # first token will surface as a 524 from Cloudflare no matter what Nginx
        # is configured to allow. Streaming starts the response early, which is
        # what keeps long answers inside that window.
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}

# ---------------------------------------------------------------------------
# Cloudflare-side settings worth checking once
#
#   SSL/TLS → Overview            "Full (strict)". Never "Flexible".
#   Caching → Cache Rules         Bypass cache for api.20080831.xyz/*. The API
#                                 sets its own headers, and a cached /api/status
#                                 would go stale behind your back.
#   Speed → Optimization          Turn off Rocket Loader, Auto Minify and Email
#                                 Obfuscation. They rewrite HTML and scripts and
#                                 have no business touching an API origin, but
#                                 they do apply to the admin UI served from the
#                                 same domain.
#   Network                       WebSockets must be ON for the realtime relay.
#                                 It is on by default on all plans.
#
# No visitor-facing certificate needs issuing: Cloudflare's edge certificate for
# *.20080831.xyz is provisioned automatically, and renews itself.
# ---------------------------------------------------------------------------
