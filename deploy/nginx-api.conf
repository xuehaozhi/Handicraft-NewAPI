# Handicraft API — Nginx reverse proxy
#
# Copy to /etc/nginx/sites-available/api.20080831.xyz, symlink it into
# sites-enabled, then obtain a certificate BEFORE enabling the file (see the
# notes at the bottom). Replace the domain if you use a different one.
#
#	Nginx → 127.0.0.1:3000 (the Docker-published port on this host)
#
# The `map` block belongs at http level. On Debian/Ubuntu, sites-enabled files
# are included from inside `http {}`, so it is fine here; if your Nginx rejects
# it, move that block to /etc/nginx/conf.d/websocket-upgrade.conf instead.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.20080831.xyz;

    # Everything goes to HTTPS. Certbot needs this port reachable to issue and
    # renew the certificate, so keep the ACME path in front of the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line rather than a separate `http2 on;` directive:
    # the standalone directive needs Nginx 1.25.1+, and Ubuntu 22.04/24.04 ship
    # 1.18/1.24, where it fails `nginx -t` outright. On newer Nginx this form is
    # deprecated but still accepted, so it works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.20080831.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.20080831.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.20080831.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Audio transcription and file uploads go through the relay. Images are
    # blocked by the application, so this only has to cover the rest.
    client_max_body_size 32m;

    # Do not advertise the Nginx version.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket passthrough, for the realtime relay endpoint. The map above
        # sends `upgrade` only when the client asked for one, and `close`
        # otherwise, which is what a normal proxied request wants.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- the part that matters for an LLM gateway ----
        #
        # Responses are streamed token by token. Nginx buffers upstream
        # responses by default, which holds the stream until the buffer fills or
        # the response ends: chat clients then sit on an empty screen and only
        # print the whole answer at once. Turning buffering off is what makes
        # `stream: true` behave.
        proxy_buffering off;
        proxy_cache off;

        # Forward the request body as it arrives instead of spooling it to disk
        # first. Removes a stall on large uploads.
        proxy_request_buffering off;

        # A slow model can take minutes to answer, and the read timeout applies
        # between two successive reads from upstream. The default 60s cuts long
        # generations off mid-stream, and the client sees a truncated answer
        # rather than an error.
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}

# ---------------------------------------------------------------------------
# Getting the certificate
#
#   1. Point an A record for api.20080831.xyz at the server's public IP and wait
#      for it to resolve:
#          dig +short api.20080831.xyz
#
#   2. Install certbot and issue the certificate. Nginx is not serving the site
#      yet, so use standalone and stop Nginx for the moment it needs port 80:
#          sudo apt install -y certbot
#          sudo systemctl stop nginx
#          sudo certbot certonly --standalone -d api.20080831.xyz
#          sudo systemctl start nginx
#
#      Alternatively, enable this file with only the port-80 server block, start
#      Nginx, and use `certbot --nginx -d api.20080831.xyz`, which edits the file
#      for you. The standalone route above leaves the file exactly as written.
#
#   3. Enable the site and reload:
#          sudo ln -s /etc/nginx/sites-available/api.20080831.xyz \
#                     /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
#   4. Open the firewall. 80 and 443 only — 3000 should not be public once the
#      proxy works (see BIND_ADDR in .env.example):
#          sudo ufw allow 80/tcp
#          sudo ufw allow 443/tcp
#          sudo ufw delete allow 3000/tcp
#
#   5. Renewal is automatic (the certbot systemd timer). Confirm with:
#          sudo certbot renew --dry-run
# ---------------------------------------------------------------------------
