# Handicraft API — Docker Compose Configuration
#
# The image is BUILT IN THE CLOUD by .github/workflows/docker-ghcr.yml and
# pushed to GHCR, so this file only pulls it. Nothing is compiled on the
# server, which matters because the build needs ~2 GB of RAM and 10-20 minutes
# (Rsbuild frontend plus the Go backend).
#
# Quick Start:
#   1. docker compose pull
#   2. docker compose up -d
#   3. Access at http://<server-ip>:3000
#
# Do NOT swap in calciumion/new-api. That upstream image contains none of the
# Handicraft customisation, so it would silently discard the fixed version
# string, the disabled update checker, the welcome banner, the status monitor
# and the image-input guard.
#
# To build from this source tree instead of pulling (for testing local edits):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Using MySQL instead of PostgreSQL: see the comments on the SQL_DSN lines.

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    # Published by the GHCR workflow. If the package is private, run
    # `docker login ghcr.io` first; making it public avoids that entirely.
    image: ghcr.io/xuehaozhi/handicraft-newapi:latest
    # Always take the registry copy, so `docker compose up -d` picks up a newer
    # image instead of silently reusing a stale local one.
    pull_policy: always
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      # BIND_ADDR defaults to 0.0.0.0 so the port works before a reverse proxy
      # exists. Once Nginx (or Caddy) is serving HTTPS and you have confirmed it
      # works, set BIND_ADDR=127.0.0.1 in .env and recreate: the port then stops
      # being reachable from the internet, and the only way in is the proxy.
      - "${BIND_ADDR:-0.0.0.0}:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # Database: SQLite by default, stored at /data/one-api.db inside the
      # ./data volume (the image's WORKDIR is /data, and SQLITE_PATH defaults to
      # a relative "one-api.db" that resolves there).
      #
      # SQLite is the right choice on a small host. PostgreSQL needs roughly
      # 150-250 MB of RAM on its own, on top of the ~200-300 MB the application
      # uses, which does not fit in a 512 MB VPS. SQLite runs in-process and
      # costs nothing extra. The default DSN already enables WAL journaling and
      # a 30s busy timeout, so concurrent reads and writes behave acceptably.
      #
      # To use PostgreSQL instead (needs >= 2 GB RAM), uncomment the SQL_DSN line
      # below, uncomment the `postgres:` service further down, and restore it in
      # depends_on. Set POSTGRES_PASSWORD in .env first.
#      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/new-api
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      # Must match the redis service's --requirepass below. Redis is not just a
      # cache here: user sessions, quota reservations and rate-limit counters
      # live in it, so the password is a shared secret between the two services.
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      # Connection pool size. Raise it for high concurrency; the upstream
      # default is 10.
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-10}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
      # Behind HTTPS these two make the refresh cookie Secure and turn on the
      # strict refresh/logout Origin check. Set both in .env once a reverse
      # proxy serves the site over TLS; leaving them off is only correct while
      # the site is plain HTTP, which is why the app warns about it at startup.
      #
      # SESSION_COOKIE_TRUSTED_URL must list the exact HTTPS origins, scheme
      # included, comma-separated, with no path and no wildcard. It is the
      # origin allowlist for refresh/logout — not a relay CORS allowlist.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
#      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    # Wait until Redis actually accepts connections, not merely until its
    # container exists. NewAPI calls FatalLog when it cannot reach Redis
    # (common.InitRedisClient pings it and dies on failure), so a bare
    # `depends_on` list makes the container exit and restart in a loop on first
    # boot until the dependency happens to win the race.
    #
    # PostgreSQL is absent on purpose: the default database is SQLite, which
    # runs in-process. See the SQL_DSN comment above to re-enable it.
    depends_on:
      redis:
        condition: service_healthy
#      postgres:  # Uncomment together with SQL_DSN above if using PostgreSQL
#        condition: service_healthy
#      mysql:  # Uncomment if using MySQL
#        condition: service_healthy
#      clickhouse:  # Uncomment if using ClickHouse for LOG_SQL_DSN
#        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    # Pinned to a major version instead of the upstream `redis:latest`, so a
    # routine `docker compose pull` cannot jump Redis majors behind your back.
    image: redis:7-alpine
    container_name: redis
    restart: always
    # --requirepass : authentication; must match REDIS_CONN_STRING on new-api.
    # --appendonly  : AOF persistence. User sessions, quota reservations and
    #                 rate-limit counters live in Redis, so without AOF plus the
    #                 volume below, `docker compose down` or a container
    #                 recreate logs every user out and drops in-flight quota
    #                 state. Upstream shipped no volume for Redis at all.
    # --maxmemory / --maxmemory-policy noeviction : a ceiling against runaway
    #                 growth. noeviction is deliberate — evicting keys would
    #                 silently discard sessions and quota state, so writes fail
    #                 loudly instead. Change to volatile-lru only if you would
    #                 rather keep serving than keep that state.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      # Sized for a small host. Redis here is caches, sessions and rate-limit
      # counters, not a primary store; 64 MB is ample for a single-node
      # deployment. Do not raise this without checking total RAM: the
      # application alone uses 200-300 MB, so a 512 MB VPS cannot spare more.
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - noeviction
    environment:
      # Read only by the healthcheck below, so the password never lands on a
      # command line where `docker inspect` or `ps` would expose it.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - new-api-network

  # Disabled by default: SQLite is the default database and needs no separate
  # process. PostgreSQL consumes roughly 150-250 MB of RAM on its own, which
  # does not fit alongside the application on a 512 MB VPS.
  #
  # To enable on a host with >= 2 GB RAM: set POSTGRES_PASSWORD in .env,
  # uncomment the SQL_DSN line above, uncomment the postgres entry in
  # depends_on, and start with the profile:
  #   docker compose --profile postgres up -d
  postgres:
    profiles: ["postgres"]
    image: postgres:15
    container_name: postgres
    restart: always
    # Tuned down from the defaults, which assume a much larger host. The
    # postgres:15 default shared_buffers alone is 128 MB.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    environment:
      POSTGRES_USER: root
      # Deliberately NOT `${POSTGRES_PASSWORD:?...}`: Docker Compose performs
      # variable interpolation across the whole file, including services whose
      # profile is inactive, so a hard-required variable here would block the
      # default SQLite deployment. An empty value makes the Postgres entrypoint
      # refuse to start with "you must specify POSTGRES_PASSWORD", which is the
      # right failure when someone enables the profile without setting it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: new-api
    # new-api waits on service_healthy, so Postgres needs a real readiness
    # probe; without one the dependency condition could never be satisfied.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

